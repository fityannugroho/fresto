# pnpm workspace settings (pnpm v11+).
# Overrides and build approvals moved here from the removed `pnpm` field in
# package.json, which pnpm >=11 no longer reads.
# Docs: https://pnpm.io/settings

# Deactivate the v11+ default supply-chain delay so installs and CI do not
# fail on freshly published transitive versions. Re-enable deliberately later
# (minimumReleaseAge: 1440) once the graph is stable.
minimumReleaseAge: 0

allowBuilds:
  puppeteer: true

overrides:
  "@codeceptjs/detox-helper": "npm:empty-npm-package@1.0.0"
  axios: ^1.19.0
  joi: ^18.2.3
  uuid: ^11.1.1
  diff: ^8.0.4
  # GHSA-gfhx-hw2g-v5hg: 7.1.1 escapes `</script>` in serialized function bodies.
  serialize-javascript: ^7.1.2
  ws: ^8.21.3
  "@xmldom/xmldom": 0.9.12

  # Security overrides for transitive advisories that direct dependency ranges
  # cannot reach (see pnpm audit / GHSA notes).
  # GHSA-pqg4-j6r4-53mv: shell-quote <1.11.0 command injection (webpack-dev-server > launch-editor).
  shell-quote: ^1.11.0
  # GHSA-68fv-2mgg-jv7q: source-map-js <1.2.2 event-loop DoS (postcss, css-loader, minimizer plugin).
  source-map-js: ^1.2.2
  # GHSA-hrr3-gc8f-f4qj: fast-uri <3.1.8 (ajv/schema-utils in the webpack toolchain).
  fast-uri: ^3.1.8
  # GHSA-3pph-fpjx-jg34: multer <2.4.0 DoS on aborted uploads (codeceptjs).
  multer: ^2.4.0
  # GHSA-5v7r-6r5c-r473: file-type <21.3.1 ASF parser infinite loop (webpack-pwa-manifest > jimp).
  file-type: ^21.3.1
  # GHSA-qhr7-859c-m2p7 / GHSA-6j4f-fj2g-mc7p / GHSA-q2hr-2g5m-vwhr:
  # brace-expansion DoS (eslint/minimatch, codeceptjs/glob, workbox). Pin each
  # major line to a patched release; parents declaring ^4 are moved onto the 5.x line.
  brace-expansion@^1: ^1.1.21
  brace-expansion@^2: ^2.1.7
  brace-expansion@^3: ^3.1.7
  brace-expansion@^4: ^5.0.12
  brace-expansion@^5: ^5.0.12
