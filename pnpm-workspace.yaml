# pnpm workspace settings (pnpm v11+).
# Overrides and build approvals moved here from the removed `pnpm` field in
# package.json, which pnpm >=11 no longer reads.
# Docs: https://pnpm.io/settings

# The 24h minimum release age supply-chain policy is re-enabled now that the dependency graph is stable.

allowBuilds:
  puppeteer: true

overrides:
  "@codeceptjs/detox-helper": "npm:empty-npm-package@1.0.0"
  axios: ^1.19.0
  joi: ^18.2.3
  uuid: ^11.1.1
  diff: ^8.0.4
  # GHSA-gfhx-hw2g-v5hg: 7.1.1 escapes `</script>` in serialized function bodies.
  serialize-javascript: ^7.1.2
  ws: ^8.21.3
  "@xmldom/xmldom": 0.9.12
